services:
  postgres-product:
    image: postgres:16-alpine
    container_name: sc-product-db
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      POSTGRES_DB: ${PRODUCT_DB_NAME:-product_db}
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER:-postgres} -d ${PRODUCT_DB_NAME:-product_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sc-product-service:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-product-service:${SC_VERSION:?SC_VERSION is required}
    container_name: sc-product-service
    environment:
      DATABASE_URL: postgres://${PRODUCT_DB_USER:-postgres}:${PRODUCT_DB_PASSWORD}@postgres-product:5432/${PRODUCT_DB_NAME:-product_db}
      SERVICE_PORT: "8081"
      RUST_LOG: ${PRODUCT_RUST_LOG:-info}
      S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-ava-product-images}
      S3_PREVIEW_BUCKET: ${S3_PREVIEW_BUCKET:-ava-product-previews}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      postgres-product:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
