services:
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ../migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-postgres} -d ${USER_DB_NAME:-user_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DATABASE_URL: postgres://${USER_DB_USER:-postgres}:${USER_DB_PASSWORD:-postgres}@postgres-user:5432/${USER_DB_NAME:-user_db}
      SERVICE_PORT: "8082"
      RUST_LOG: ${USER_RUST_LOG:-info,actix_web=info,user_service=debug,sqlx=warn}
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: unless-stopped
