services:
  postgres-user:
    image: postgres:16-alpine
    container_name: sc-user-db
    environment:
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ../migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-postgres} -d ${USER_DB_NAME:-user_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sc-user-service:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-user-service:${SC_VERSION}
    container_name: sc-user-service
    environment:
      DATABASE_URL: postgres://${USER_DB_USER:-postgres}:${USER_DB_PASSWORD}@postgres-user:5432/${USER_DB_NAME:-user_db}
      SERVICE_PORT: "8082"
      RUST_LOG: ${USER_RUST_LOG:-info}
    depends_on:
      postgres-user:
        condition: service_healthy
    restart: unless-stopped
