name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'server/auth-service/**'
            user:
              - 'server/user-service/**'
            product:
              - 'server/product-service/**'
            admin:
              - 'client/sc-admin/**'

  backend:
    name: backend (${{ matrix.service }})
    needs: changes
    if: ${{ needs.changes.outputs[matrix.filter_key] == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            test_args: --features test-mocks
            filter_key: auth
          - service: user-service
            test_args: --features test-mocks
            filter_key: user
          - service: product-service
            test_args: ""
            filter_key: product
    defaults:
      run:
        working-directory: server/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/${{ matrix.service }} -> target
          key: ${{ matrix.service }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets ${{ matrix.test_args }}

      - name: build
        run: cargo build --all-targets ${{ matrix.test_args }}

      - name: test
        run: cargo test ${{ matrix.test_args }}

  frontend:
    name: frontend (${{ matrix.app }})
    needs: changes
    if: ${{ needs.changes.outputs[matrix.filter_key] == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: sc-admin
            filter_key: admin
    defaults:
      run:
        working-directory: client/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
