name: sc

services:
  sc-product-db:
    image: postgres:16-alpine
    container_name: sc-product-db
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD is required}
      POSTGRES_DB: ${PRODUCT_DB_NAME:-product_db}
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
      - ./server/product-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER:-postgres} -d ${PRODUCT_DB_NAME:-product_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sc-user-db:
    image: postgres:16-alpine
    container_name: sc-user-db
    environment:
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./server/user-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-postgres} -d ${USER_DB_NAME:-user_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sc-auth-db:
    image: postgres:16-alpine
    container_name: sc-auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./server/auth-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-postgres} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_IMAGES_BUCKET:-ava-product-images} &&
      mc mb --ignore-existing local/${S3_PREVIEW_BUCKET:-ava-product-previews}
      "
    restart: "no"

  sc-product-service:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-product-service:${SC_VERSION:?SC_VERSION is required}
    container_name: sc-product-service
    environment:
      DATABASE_URL: postgres://${PRODUCT_DB_USER:-postgres}:${PRODUCT_DB_PASSWORD}@sc-product-db:5432/${PRODUCT_DB_NAME:-product_db}
      SERVICE_PORT: "8081"
      RUST_LOG: ${PRODUCT_RUST_LOG:-info}
      S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-ava-product-images}
      S3_PREVIEW_BUCKET: ${S3_PREVIEW_BUCKET:-ava-product-previews}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      sc-product-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sc-auth-service:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-auth-service:${SC_VERSION}
    container_name: sc-auth-service
    environment:
      DATABASE_URL: postgres://${AUTH_DB_USER:-postgres}:${AUTH_DB_PASSWORD}@sc-auth-db:5432/${AUTH_DB_NAME:-auth_db}
      SERVICE_PORT: "8083"
      RUST_LOG: ${AUTH_RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://sc-user-service:8082}
    depends_on:
      sc-auth-db:
        condition: service_healthy
    restart: unless-stopped

  sc-user-service:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-user-service:${SC_VERSION}
    container_name: sc-user-service
    environment:
      DATABASE_URL: postgres://${USER_DB_USER:-postgres}:${USER_DB_PASSWORD}@sc-user-db:5432/${USER_DB_NAME:-user_db}
      SERVICE_PORT: "8082"
      RUST_LOG: ${USER_RUST_LOG:-info}
    depends_on:
      sc-user-db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sc-product-service
      - sc-auth-service
      - sc-user-service
    restart: unless-stopped

  sc-client-admin:
    image: ghcr.io/${GHCR_OWNER:-tortalpha}/sc-admin:${SC_VERSION}
    container_name: sc-client-admin
    ports:
      - "127.0.0.1:4201:80"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres-product-data:
  postgres-user-data:
  postgres-auth-data:
  minio-data:
