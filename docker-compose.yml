services:
  # ───── Databases ─────

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
      - ./server/product-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./server/user-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./server/auth-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───── Object Storage ─────

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ava-product-images &&
      mc mb --ignore-existing local/ava-product-previews
      "

  # ───── Backend Services ─────

  product-service:
    build:
      context: ./server/product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-product:5432/product_db
      SERVICE_PORT: "8081"
      S3_IMAGES_BUCKET: ava-product-images
      S3_PREVIEW_BUCKET: ava-product-previews
      AWS_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      postgres-product:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  auth-service:
    build:
      context: ./server/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-auth:5432/auth_db
      SERVICE_PORT: "8083"
      JWT_SECRET: dev-jwt-secret-change-in-production
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      postgres-auth:
        condition: service_healthy

  user-service:
    build:
      context: ./server/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-user:5432/user_db
      SERVICE_PORT: "8082"
    depends_on:
      postgres-user:
        condition: service_healthy

  # ───── Frontend ─────

  sc-client:
    build:
      context: ./client/sc-client
      dockerfile: Dockerfile
    container_name: sc-client
    depends_on:
      - product-service
      - auth-service
      - user-service

  # ───── API Gateway ─────

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - product-service
      - auth-service
      - user-service
      - sc-client

volumes:
  postgres-product-data:
  postgres-user-data:
  postgres-auth-data:
  minio-data:
