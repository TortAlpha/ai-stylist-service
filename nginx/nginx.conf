# Trust upstream (cloudflared on host or in-network) to provide real client IP.
# Host port is bound to 127.0.0.1:80 by compose (see docker-compose.nginx.prod.yml),
# but inside the docker network nginx listens on 0.0.0.0:80. To prevent any other
# container in sc_default from spoofing CF-Connecting-IP, only trust the docker
# bridge gateway range and loopback.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header   CF-Connecting-IP;
real_ip_recursive on;

# Rate limiting: 2 requests/minute per real client IP for the login endpoint.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/m;

upstream product-service {
    server sc-product-service:8081;
}

upstream user-service {
    server sc-user-service:8082;
}

upstream auth-service {
    server sc-auth-service:8083;
}

upstream ai-service {
    server sc-ai-service:8084;
}

server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver for dynamic upstream re-resolution.
    resolver 127.0.0.11 ipv6=off valid=30s;

    set $auth_upstream      http://sc-auth-service:8083;
    set $product_upstream   http://sc-product-service:8081;
    set $user_upstream      http://sc-user-service:8082;
    set $ai_upstream        http://sc-ai-service:8084;
    set $sc_client_upstream http://sc-client-admin:80;

    client_max_body_size 50M;

    # ── Internal auth subrequest (not accessible from outside) ────
    location = /internal/auth/verify {
        internal;
        proxy_pass              $auth_upstream/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization  $http_authorization;
    }

    # ── Sensitive auth: login under rate limit (anti-brute-force) ─
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Public auth (refresh, logout — no JWT required) ───────────
    location /api/auth/ {
        proxy_pass $auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Protected: Products ───────────────────────────────────────
    location /api/products {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Brands ─────────────────────────────────────────
    location /api/brands {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Categories ─────────────────────────────────────
    location /api/categories {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Tags ───────────────────────────────────────────
    location /api/tags {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Types ──────────────────────────────────────────
    location /api/types {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Sizes ──────────────────────────────────────────
    location /api/sizes {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Listings ───────────────────────────────────────
    location /api/listings {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Admin Products ────────────────────────────────
    location /api/admin/products {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Admin Brands ──────────────────────────────────
    location /api/admin/brands {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Admin Categories ──────────────────────────────
    location /api/admin/categories {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Admin Tags ────────────────────────────────────
    location /api/admin/tags {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Admin Purchase Locations ──────────────────────
    location /api/admin/purchase-locations {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
