# Rate limiting: 5 requests/minute per IP for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream product-service {
    server product-service:8081;
}

upstream user-service {
    server user-service:8082;
}

upstream auth-service {
    server auth-service:8083;
}

server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver for dynamic upstream re-resolution.
    resolver 127.0.0.11 ipv6=off valid=30s;

    set $auth_upstream      http://auth-service:8083;
    set $product_upstream   http://product-service:8081;
    set $user_upstream      http://user-service:8082;
    set $sc_client_upstream http://sc-client:80;

    client_max_body_size 50M;

    # ── Internal auth subrequest (not accessible from outside) ────
    location = /internal/auth/verify {
        internal;
        proxy_pass              $auth_upstream/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization  $http_authorization;
    }

    # ── Public auth (login, refresh — no JWT required) ────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass $auth_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Protected: Products ───────────────────────────────────────
    location /api/products {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Brands ─────────────────────────────────────────
    location /api/brands {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $product_upstream;
        proxy_set_header Host              $host;
