# Rate limiting: 5 requests/minute per IP for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

upstream product-service {
    server product-service:8081;
}

upstream user-service {
    server user-service:8082;
}

upstream auth-service {
    server auth-service:8083;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # ── Internal auth subrequest (not accessible from outside) ────
    location = /internal/auth/verify {
        internal;
        proxy_pass              http://auth-service/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization  $http_authorization;
    }

    # ── Public auth (login, refresh — no JWT required) ────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://auth-service/api/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Protected: Products ───────────────────────────────────────
    location /api/products {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/products;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Brands ─────────────────────────────────────────
    location /api/brands {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/brands;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Categories ─────────────────────────────────────
    location /api/categories {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/categories;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Tags ───────────────────────────────────────────
    location /api/tags {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/tags;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Types ──────────────────────────────────────────
    location /api/types {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/types;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Sizes ──────────────────────────────────────────
    location /api/sizes {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/sizes;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Listings ───────────────────────────────────────
    location /api/listings {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://product-service/api/listings;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Users ──────────────────────────────────────────
    location /api/users {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass http://user-service/api/users;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Frontend SPA ──────────────────────────────────────────────
    location / {
        proxy_pass http://sc-client:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
