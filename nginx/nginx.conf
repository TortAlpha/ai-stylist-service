    # ── Protected: Users ──────────────────────────────────────────
    location /api/users {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $user_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;
    }

    # ── Protected: Stylist (AI service, SSE) ──────────────────────
    location /api/stylist/ {
        auth_request     /internal/auth/verify;
        auth_request_set $user_id   $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;

        proxy_pass $ai_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id         $user_id;
        proxy_set_header X-User-Role       $user_role;

        # SSE: disable buffering, hold connections open, allow long streams.
        proxy_buffering           off;
        proxy_cache               off;
        proxy_http_version        1.1;
        proxy_set_header Connection "";
        proxy_read_timeout        600s;
        proxy_send_timeout        600s;
    }

    # ── Frontend SPA ──────────────────────────────────────────────
    location / {
        proxy_pass $sc_client_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
