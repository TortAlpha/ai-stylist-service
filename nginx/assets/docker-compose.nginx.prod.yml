services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sc-product-service
      - sc-auth-service
      - sc-user-service
    restart: unless-stopped
